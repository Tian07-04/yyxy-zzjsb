<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>组织建设部 · 后台管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/theme-extras.css" />
</head>
<body class="admin-body">
  <!-- 后台（无会话时由 admin.js 跳转 login.html） -->
  <div id="admin" class="admin" hidden>
    <header class="admin__bar">
      <div class="admin__brand">⚙ 网站后台</div>
      <div class="admin__actions">
        <span id="modeNote" class="admin__mode"></span>
        <span id="saveState" class="admin__state"></span>
        <button id="saveBtn" class="btn btn--ghost btn--sm">保存草稿</button>
        <button id="submitBtn" class="btn btn--ghost btn--sm">提交审核</button>
        <button id="publishBtn" class="btn btn--primary btn--sm">发布上线</button>
        <span id="statusBadge" class="admin__state"></span>
        <button id="exportBtn" class="btn btn--ghost btn--sm">导出 content.js</button>
        <button id="pwdBtn" class="btn btn--ghost btn--sm">修改密码</button>
        <a id="viewBtn" class="btn btn--ghost btn--sm" href="index.html" target="_blank">查看网站</a>
        <button id="logoutBtn" class="btn btn--ghost btn--sm">退出</button>
      </div>
    </header>
    <div class="admin__body">
      <nav class="admin__nav" id="adminNav">
        <div class="nav-group">
          <span class="nav-group__title">基础信息</span>
          <button class="admin__tab active" data-tab="basic">基础设置</button>
          <button class="admin__tab" data-tab="facts">学院名片</button>
          <button class="admin__tab" data-tab="team">组织架构</button>
          <button class="admin__tab" data-tab="duties">工作职责</button>
          <button class="admin__tab" data-tab="activities">特色活动</button>
        </div>
        <div class="nav-group">
          <span class="nav-group__title">党团内容</span>
          <button class="admin__tab" data-tab="party">党建工作</button>
          <button class="admin__tab" data-tab="league">团建工作</button>
          <button class="admin__tab" data-tab="announce">通知公告</button>
        </div>
        <div class="nav-group">
          <span class="nav-group__title">系统与单页</span>
          <button class="admin__tab" data-tab="pages">单页</button>
          <button class="admin__tab" data-tab="history">历史版本</button>
          <button class="admin__tab" data-tab="sop">审核说明</button>
          <button class="admin__tab" data-tab="messages">留言管理</button>
        </div>
      </nav>
      <main class="admin__main">
        <div class="panel__ctx" id="panelCtx"></div>
        <div id="panel"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=20260727e"></script>
  <script src="assets/js/content.js?v=20260727a"></script>
  <script src="assets/js/store.js?v=20260727e"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
